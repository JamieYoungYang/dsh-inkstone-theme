name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 142 个必需 token 覆盖 + 1554 组对比度 + 边框上下限
      - name: Contrast and token audit
        run: npm run audit
      - name: Manifest sanity
        run: |
          node -e "const p=require('./package.json');
            if (p.private) throw new Error('package must not be private');
            if (!p.license) throw new Error('license missing');
            if (!p.engines || !p.engines.dsh) throw new Error('engines.dsh missing');
            console.log('manifest ok:', p.name, p.version);"
      - name: Package builds
        run: npm pack --dry-run
      # 只查会被打包的文件，跳过工作流自身与忽略目录
      - name: No stale package identifiers
        run: |
          hit=$(git ls-files '*.js' '*.yml' '*.json' | grep -v '^.github/' | xargs grep -ln "palette-pack" || true)
          if [ -n "$hit" ]; then echo "stale identifier in: $hit"; exit 1; fi
